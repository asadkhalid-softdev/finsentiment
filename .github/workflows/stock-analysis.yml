name: Daily Stock Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '20 6 * * *'  # every day at 06:20 UTC

jobs:
  update-stock-list:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

  - name: Patch yahoo_fin bugs (52 Week Range + Change %)
    run: |
      FILE=$(python -c "import yahoo_fin.stock_info as s; print(s.__file__)")

      # Patch: avoid KeyError on '52 Week Range'
      sed -i 's|del df\["52 Week Range"\]|if "52 Week Range" in df.columns: del df["52 Week Range"]|' "$FILE"

      # Patch: rename '% Change' to 'Change %' in mapping line
      sed -i 's|df\["% Change"\]|df["Change %"]|' "$FILE"

    - name: Run update_stocks.py
      run: python update_stocks.py

    - name: List files after update
      run: ls -lah

    - name: Upload intermediate Stocks.xlsx
      uses: actions/upload-artifact@v4
      with:
        name: Intermediate-Stocks
        path: stocks.xlsx

  sentiment-analysis:
    needs: update-stock-list
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download Stocks.xlsx from previous job
      uses: actions/download-artifact@v4
      with:
        name: Intermediate-Stocks

    - name: Run stock_sentiment.py
      run: python stock_sentiment.py

    - name: Upload final Stocks.xlsx
      uses: actions/upload-artifact@v4
      with:
        name: Final-Stocks
        path: Stocks.xlsx
