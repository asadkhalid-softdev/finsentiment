# .github/workflows/stock-analysis.yml

name: Daily Stock Pipeline

on:
  workflow_dispatch:  # Allows manual triggering
  schedule:
    - cron: '0 17 * * 1'  # Every Monday at 17:00 UTC; jobs below gate this to the last Monday of the month

jobs:
  check-last-monday:
    name: Check Last Monday
    runs-on: ubuntu-latest
    outputs:
      is_last_monday: ${{ steps.check.outputs.is_last_monday }}

    steps:
    - name: Check whether today is the last Monday of the month
      id: check
      run: |
        if [ "$(date -u -d '+7 days' +%m)" != "$(date -u +%m)" ]; then
          echo "is_last_monday=true" >> "$GITHUB_OUTPUT"
        else
          echo "is_last_monday=false" >> "$GITHUB_OUTPUT"
        fi

  update-stock-list:
    name: Update Stock List and Apply Patches
    needs: check-last-monday
    if: ${{ github.event_name != 'schedule' || needs.check-last-monday.outputs.is_last_monday == 'true' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Specify your desired Python version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run update_stocks.py
      run: python update_stocks.py

    - name: List files after update
      run: ls -lah # List files including hidden ones with details

    - name: Upload intermediate Stocks.xlsx
      uses: actions/upload-artifact@v4
      with:
        name: Intermediate-Stocks # Artifact name
        path: stocks.xlsx         # Path to the file to upload

  sentiment-analysis:
    name: Perform Sentiment Analysis
    needs: update-stock-list # This job depends on the previous one succeeding
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Use the same Python version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download Stocks.xlsx from previous job
      uses: actions/download-artifact@v4
      with:
        name: Intermediate-Stocks # Must match the upload name
        # No path needed here, it downloads to the workspace root by default

    - name: List files after download
      run: ls -lah # Verify the excel file is present

    - name: Run stock_sentiment.py
      run: python stock_sentiment.py

    - name: List files after sentiment analysis
      run: ls -lah # Verify the excel file was potentially modified

    - name: Upload final stock analysis files
      uses: actions/upload-artifact@v4
      with:
        name: Final-Stock-Analysis
        path: |
          stocks.xlsx
          stocks_metrics.xlsx
        if-no-files-found: error
