# .github/workflows/stock-analysis.yml

name: Daily Stock Pipeline

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: '20 6 * * *'  # every day at 06:20 UTC

jobs:
  update-stock-list:
    name: Update Stock List and Apply Patches
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Specify your desired Python version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Patch yahoo_fin bugs (52 Week Range + Change %)
      id: patch_yahoo_fin # Added an ID for potential future use
      run: |
        # Find the file path for yahoo_fin.stock_info
        FILE=$(python -c "import yahoo_fin.stock_info as s; print(s.__file__)")
        echo "INFO: Found yahoo_fin.stock_info at: $FILE"

        # Verify the file exists before attempting to patch
        if [ ! -f "$FILE" ]; then
          echo "ERROR: yahoo_fin file not found at $FILE"
          exit 1
        fi

        echo "--- Content Before Patching ---"
        # Display the relevant function content for debugging (adjust grep context lines '-C' if needed)
        grep -C 15 '_raw_get_daily_info' "$FILE" || echo "WARNING: Could not grep _raw_get_daily_info before patching."
        echo "---"

        # Patch 1: Make '52 Week Range' deletion conditional and robust to whitespace
        # Matches optional whitespace at the start, then the exact delete line.
        echo "Applying Patch 1: 52 Week Range (Conditional Deletion)"
        sed -i 's|^\s*del df\["52 Week Range"\]|    if "52 Week Range" in df.columns: del df["52 Week Range"]|' "$FILE"
        if grep -q 'if "52 Week Range" in df.columns: del df\["52 Week Range"\]' "$FILE"; then
          echo "INFO: Patch 1 applied successfully."
        else
          echo "WARNING: Patch 1 may not have been applied. Check 'Content Before Patching' and sed command."
        fi

        # Patch 2: Rename '% Change' ONLY on the specific map assignment line
        # Targets the line starting with optional spaces, df["% Change"] = df["% Change"].map(...)
        # and replaces the *first* df["% Change"] on that line.
        echo "Applying Patch 2: % Change -> Change % (Specific Line)"
        # Note: Escaped characters: \[, \], \., %
        sed -i '/^\s*df\["% Change"\] = df\["% Change"\]\.map(lambda x: float(x\.strip/s|df\["% Change"\]|df["Change %"]|1' "$FILE"
        # Check if the specific line now contains 'Change %' where expected
        if grep -q '^\s*df\["Change %"\] = df\["% Change"\]\.map(lambda x: float(x\.strip' "$FILE"; then
           echo "INFO: Patch 2 applied successfully."
        else
           echo "WARNING: Patch 2 may not have been applied. Check 'Content Before Patching' and sed command. The line structure in the library might have changed."
        fi

        echo "--- Content After Patching ---"
        # Display the relevant function content again to verify patches
        grep -C 15 '_raw_get_daily_info' "$FILE" || echo "WARNING: Could not grep _raw_get_daily_info after patching."
        echo "--- End Patching ---"

    - name: Run update_stocks.py
      run: python update_stocks.py

    - name: List files after update
      run: ls -lah # List files including hidden ones with details

    - name: Upload intermediate Stocks.xlsx
      uses: actions/upload-artifact@v4
      with:
        name: Intermediate-Stocks # Artifact name
        path: stocks.xlsx         # Path to the file to upload

  sentiment-analysis:
    name: Perform Sentiment Analysis
    needs: update-stock-list # This job depends on the previous one succeeding
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Use the same Python version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download Stocks.xlsx from previous job
      uses: actions/download-artifact@v4
      with:
        name: Intermediate-Stocks # Must match the upload name
        # No path needed here, it downloads to the workspace root by default

    - name: List files after download
      run: ls -lah # Verify the excel file is present

    - name: Run stock_sentiment.py
      run: python stock_sentiment.py

    - name: List files after sentiment analysis
      run: ls -lah # Verify the excel file was potentially modified

    - name: Upload final Stocks.xlsx
      uses: actions/upload-artifact@v4
      with:
        name: Final-Stocks  # Different name for the final artifact
        path: stocks.xlsx   # Path to the final file