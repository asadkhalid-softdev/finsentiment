<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Republic Portfolio Parser</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3a;
    --accent: #7b5af5;
    --accent-hover: #9370ff;
    --green: #2ecc71;
    --red: #e74c3c;
    --text: #e8e8f0;
    --text-muted: #7a7a9a;
    --text-dim: #4a4a6a;
    --radius: 10px;
    --font: 'Inter', system-ui, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  header { text-align: center; }
  header h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
  header p { margin-top: 6px; color: var(--text-muted); font-size: 0.875rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    width: 100%;
    max-width: 960px;
  }

  .paste-area label {
    display: block;
    font-size: 0.75rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  textarea {
    width: 100%;
    height: 130px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 0.75rem;
    line-height: 1.5;
    padding: 12px 14px;
    resize: vertical;
    outline: none;
    transition: border-color 0.15s;
  }
  textarea::placeholder { color: var(--text-dim); }
  textarea:focus { border-color: var(--accent); }

  .actions-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
  }

  button {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 18px;
    border: none;
    border-radius: 7px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s, color 0.15s;
    outline: none;
  }

  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }

  .btn-secondary { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
  .btn-secondary:hover { color: var(--text); border-color: #3a3a5a; }

  .btn-icon {
    padding: 8px;
    background: var(--surface2);
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 7px;
  }
  .btn-icon:hover { color: var(--text); border-color: #3a3a5a; }
  .btn-icon svg { display: block; }

  .status-badge { font-size: 0.78rem; color: var(--text-muted); margin-left: auto; }

  /* Table section */
  .table-section { width: 100%; max-width: 960px; display: none; }

  .table-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .table-title { font-size: 0.85rem; font-weight: 500; color: var(--text-muted); }
  .table-header-actions { display: flex; gap: 8px; }

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  table { width: 100%; border-collapse: collapse; font-size: 0.855rem; }

  /* Column headers */
  thead th {
    background: var(--surface2);
    color: var(--text-muted);
    font-weight: 500;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    padding: 0;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    user-select: none;
  }

  .th-inner {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 11px 14px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .th-inner:hover { background: #22223a; color: var(--text); }

  thead th.sorted .th-inner { color: var(--accent); }

  .th-label { flex: 1; }

  /* Right-align numeric column headers */
  thead th.num-col .th-inner { justify-content: flex-end; }
  thead th.num-col .th-label { flex: none; }

  /* Sort icon */
  .sort-icon {
    display: inline-flex;
    flex-direction: column;
    gap: 1px;
    opacity: 0.3;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }
  .sort-icon span {
    display: block;
    width: 0;
    height: 0;
  }
  .sort-icon .arr-up {
    border-left: 3.5px solid transparent;
    border-right: 3.5px solid transparent;
    border-bottom: 4px solid currentColor;
  }
  .sort-icon .arr-down {
    border-left: 3.5px solid transparent;
    border-right: 3.5px solid transparent;
    border-top: 4px solid currentColor;
  }
  .th-inner:hover .sort-icon { opacity: 0.7; }
  thead th.sorted .sort-icon { opacity: 1; }
  thead th.sorted.asc .arr-down { opacity: 0.25; }
  thead th.sorted.desc .arr-up { opacity: 0.25; }


  /* Table rows */
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }

  td { padding: 11px 14px; vertical-align: middle; white-space: nowrap; }

  td.col-num { color: var(--text-dim); font-size: 0.75rem; width: 36px; }
  td.col-name { font-weight: 500; color: var(--text); white-space: normal; min-width: 140px; }
  td.col-isin { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 0.78rem; color: var(--text-muted); letter-spacing: 0.02em; }
  td.col-shares { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; text-align: right; color: var(--text-muted); }
  td.col-price { font-family: 'JetBrains Mono', monospace; font-weight: 500; text-align: right; }
  td.col-value { font-family: 'JetBrains Mono', monospace; font-weight: 500; text-align: right; color: var(--text-muted); }
  td.col-perf { text-align: right; font-weight: 600; font-size: 0.82rem; }

  .perf-positive { color: var(--green); }
  .perf-negative { color: var(--red); }
  .perf-arrow { font-size: 0.6rem; margin-right: 2px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 0.83rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    white-space: nowrap;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Error */
  .error-msg {
    background: rgba(231,76,60,0.1);
    border: 1px solid rgba(231,76,60,0.3);
    color: #e74c3c;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 0.82rem;
    display: none;
    margin-top: 10px;
  }

  @media (max-width: 640px) {
    body { padding: 20px 12px; }
    td, th { padding: 9px 10px; }
    td.col-isin, td.col-shares { display: none; }
    thead th.col-isin, thead th.col-shares { display: none; }
  }
</style>
</head>
<body>

<header>
  <h1>Trade Republic Portfolio Parser</h1>
  <p>Paste portfolio HTML to extract investment data as a table</p>
</header>

<div class="card paste-area">
  <label for="html-input">Paste HTML</label>
  <textarea id="html-input" placeholder="Paste the Trade Republic portfolio section HTML here…"></textarea>
  <div class="error-msg" id="error-msg"></div>
  <div class="actions-row">
    <button class="btn-primary" id="parse-btn">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M2 3h12v2H2zm0 4h8v2H2zm0 4h10v2H2z"/></svg>
      Parse
    </button>
    <button class="btn-secondary" id="clear-btn">Clear</button>
    <span class="status-badge" id="status-badge"></span>
  </div>
</div>

<div class="table-section" id="table-section">
  <div class="table-header-row">
    <span class="table-title" id="table-title"></span>
    <div class="table-header-actions">
      <button class="btn-icon" id="copy-isin-btn" title="Copy names as Markdown list">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M5 1h8a2 2 0 0 1 2 2v9h-1.5V3a.5.5 0 0 0-.5-.5H5V1zm-3 3h8a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm0 1.5v9h8V5.5H2z"/>
        </svg>
      </button>
      <button class="btn-icon" id="download-btn" title="Download as Markdown">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 10.5L4.5 7h2V2h3v5h2L8 10.5zM2 13h12v1.5H2V13z"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="table-wrap">
    <table id="result-table">
      <thead id="table-head">
        <tr>
          <th data-col="num" class="col-num">
            <div class="th-inner">
              <span class="th-label">#</span>
              <span class="sort-icon"><span class="arr-up"></span><span class="arr-down"></span></span>
            </div>
          </th>
          <th data-col="name" class="col-name">
            <div class="th-inner">
              <span class="th-label">Name</span>
              <span class="sort-icon"><span class="arr-up"></span><span class="arr-down"></span></span>
            </div>
          </th>
          <th data-col="isin" class="col-isin">
            <div class="th-inner">
              <span class="th-label">ISIN</span>
              <span class="sort-icon"><span class="arr-up"></span><span class="arr-down"></span></span>
            </div>
          </th>
          <th data-col="shares" class="col-shares num-col">
            <div class="th-inner">
              <span class="th-label">Shares</span>
              <span class="sort-icon"><span class="arr-up"></span><span class="arr-down"></span></span>
            </div>
          </th>
          <th data-col="price" class="col-price num-col">
            <div class="th-inner">
              <span class="th-label">Invested</span>
              <span class="sort-icon"><span class="arr-up"></span><span class="arr-down"></span></span>
            </div>
          </th>
          <th data-col="value" class="col-value num-col">
            <div class="th-inner">
              <span class="th-label">Price</span>
              <span class="sort-icon"><span class="arr-up"></span><span class="arr-down"></span></span>
            </div>
          </th>
          <th data-col="perf" class="col-perf num-col">
            <div class="th-inner">
              <span class="th-label">Return</span>
              <span class="sort-icon"><span class="arr-up"></span><span class="arr-down"></span></span>
            </div>
          </th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const htmlInput   = document.getElementById('html-input');
  const parseBtn    = document.getElementById('parse-btn');
  const clearBtn    = document.getElementById('clear-btn');
  const tableSection = document.getElementById('table-section');
  const tableBody   = document.getElementById('table-body');
  const tableHead   = document.getElementById('table-head');
  const tableTitle  = document.getElementById('table-title');
  const statusBadge = document.getElementById('status-badge');
  const errorMsg    = document.getElementById('error-msg');
  const downloadBtn = document.getElementById('download-btn');
  const copyIsinBtn  = document.getElementById('copy-isin-btn');
  const toast       = document.getElementById('toast');

  let parsedRows = [];
  let sortCol    = 'num';
  let sortDir    = 'asc';

  // ── Utilities ──────────────────────────────────────────────────────────────

  function showToast(msg, duration = 2000) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), duration);
  }

  function showError(msg) { errorMsg.textContent = msg; errorMsg.style.display = 'block'; }
  function clearError()   { errorMsg.style.display = 'none'; errorMsg.textContent = ''; }

  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ── Parsing ────────────────────────────────────────────────────────────────

  function parseShares(el) {
    if (!el) return '';
    const clone = el.cloneNode(true);
    clone.querySelectorAll('svg').forEach(s => s.remove());
    return clone.textContent.trim();
  }

  function parsePrice(el) {
    if (!el) return '';
    return el.textContent.replace(/\u00a0/g, ' ').trim();
  }

  function parsePerformance(el) {
    if (!el) return { text: '', value: null, positive: null };
    const dataEl = el.querySelector('data.performance__relative');
    const text   = dataEl ? dataEl.textContent.replace(/\u00a0/g, ' ').trim() : '';
    const value  = dataEl ? parseFloat(dataEl.getAttribute('value')) : null;
    const pos    = el.classList.contains('-positive');
    const neg    = el.classList.contains('-negative');
    return { text, value, positive: pos ? true : (neg ? false : null) };
  }

  function strToNum(str) {
    const m = String(str).match(/[\d.,]+/);
    return m ? parseFloat(m[0].replace(',', '.')) : 0;
  }

  function calcValue(shares, price) {
    const s = parseFloat(shares.replace(',', '.'));
    const p = strToNum(price);
    if (isNaN(s) || isNaN(p)) return '';
    return (s * p).toFixed(2) + ' €';
  }

  function parseHTML() {
    clearError();
    const raw = htmlInput.value.trim();
    if (!raw) { showError('Please paste some HTML first.'); return; }

    const doc   = new DOMParser().parseFromString(raw, 'text/html');
    const items = doc.querySelectorAll('li[id]');
    if (!items.length) {
      showError('No portfolio items found. Make sure you paste the full <section> or <ul> element.');
      return;
    }

    parsedRows = [];
    items.forEach(li => {
      const name   = li.querySelector('.instrumentListItem__name')?.textContent.trim() ?? '';
      if (!name) return;
      const isin   = li.id;
      const shares = parseShares(li.querySelector('.instrumentListItem__sharesTag'));
      const price  = parsePrice(li.querySelector('.instrumentListItem__currentPrice'));
      const perf   = parsePerformance(li.querySelector('.trPerformanceMeter'));
      const value  = calcValue(shares, price);
      parsedRows.push({ isin, name, shares, price, value, perf });
    });

    sortCol = 'num';
    sortDir = 'asc';
    applySortAndRender();

    tableSection.style.display = 'block';
    tableTitle.textContent = `${parsedRows.length} positions`;
    statusBadge.textContent = `${parsedRows.length} items parsed`;
  }

  // ── Sorting ────────────────────────────────────────────────────────────────

  function sortValue(row, col) {
    switch (col) {
      case 'num':    return parsedRows.indexOf(row);
      case 'name':   return row.name.toLowerCase();
      case 'isin':   return row.isin;
      case 'shares': return strToNum(row.shares);
      case 'price':  return strToNum(row.price);
      case 'value':  return strToNum(row.value);
      case 'perf':   return (row.perf.positive === false ? -1 : 1) * (row.perf.value ?? 0);
      default:       return 0;
    }
  }

  function applySortAndRender() {
    const sorted = [...parsedRows].sort((a, b) => {
      const va = sortValue(a, sortCol);
      const vb = sortValue(b, sortCol);
      if (typeof va === 'string') return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
      return sortDir === 'asc' ? va - vb : vb - va;
    });
    renderTable(sorted);
    updateSortUI();
  }

  function updateSortUI() {
    tableHead.querySelectorAll('th').forEach(th => {
      const col = th.dataset.col;
      th.classList.toggle('sorted', col === sortCol);
      th.classList.toggle('asc',    col === sortCol && sortDir === 'asc');
      th.classList.toggle('desc',   col === sortCol && sortDir === 'desc');
    });
  }

  // ── Rendering ──────────────────────────────────────────────────────────────

  function renderTable(rows) {
    tableBody.innerHTML = '';
    rows.forEach((r, i) => {
      const tr        = document.createElement('tr');
      const perfSign  = r.perf.positive === true ? '+' : (r.perf.positive === false ? '−' : '');
      const perfClass = r.perf.positive === true ? 'perf-positive' : (r.perf.positive === false ? 'perf-negative' : '');
      const arrow     = r.perf.positive === true ? '▲' : (r.perf.positive === false ? '▼' : '');

      tr.innerHTML = `
        <td class="col-num">${i + 1}</td>
        <td class="col-name">${escHtml(r.name)}</td>
        <td class="col-isin">${escHtml(r.isin)}</td>
        <td class="col-shares">${escHtml(r.shares)}</td>
        <td class="col-price">${escHtml(r.price)}</td>
        <td class="col-value">${escHtml(r.value)}</td>
        <td class="col-perf ${perfClass}"><span class="perf-arrow">${arrow}</span>${escHtml(perfSign + r.perf.text)}</td>
      `;
      tableBody.appendChild(tr);
    });
  }

  // ── Markdown ───────────────────────────────────────────────────────────────

  function buildMarkdown() {
    const header = '| # | Name | ISIN | Shares | Invested | Price | Return |';
    const sep    = '|---|------|------|-------:|------:|------:|-------:|';
    const rows   = [...parsedRows]
      .sort((a, b) => {
        const va = sortValue(a, sortCol), vb = sortValue(b, sortCol);
        if (typeof va === 'string') return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
        return sortDir === 'asc' ? va - vb : vb - va;
      })
      .map((r, i) => {
        const perfSign = r.perf.positive === true ? '+' : (r.perf.positive === false ? '−' : '');
        const arrow    = r.perf.positive === true ? '▲' : (r.perf.positive === false ? '▼' : '');
        return `| ${i+1} | ${r.name} | ${r.isin} | ${r.shares} | ${r.price} | ${r.value} | ${arrow} ${perfSign}${r.perf.text} |`;
      });
    return [header, sep, ...rows].join('\n');
  }

  function downloadMarkdown() {
    if (!parsedRows.length) return;
    const blob = new Blob([buildMarkdown()], { type: 'text/markdown;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `portfolio_${new Date().toISOString().slice(0, 10)}.md`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Markdown downloaded');
  }

  function copyNames() {
    if (!parsedRows.length) return;
    const md = parsedRows.map(r => `- ${r.name}`).join('\n');
    navigator.clipboard.writeText(md).then(() =>
      showToast(`Copied ${parsedRows.length} names to clipboard`)
    );
  }

  // ── Events ─────────────────────────────────────────────────────────────────

  // Sort on header click (but not on the copy icon)
  tableHead.addEventListener('click', e => {
    if (e.target.closest('#copy-isin-icon')) return;
    const th = e.target.closest('th[data-col]');
    if (!th || !parsedRows.length) return;
    const col = th.dataset.col;
    if (col === sortCol) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortCol = col;
      sortDir = 'asc';
    }
    applySortAndRender();
  });

  copyIsinBtn.addEventListener('click', copyNames);

  parseBtn.addEventListener('click', parseHTML);
  htmlInput.addEventListener('paste', () => setTimeout(parseHTML, 0));
  htmlInput.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) parseHTML(); });

  clearBtn.addEventListener('click', () => {
    htmlInput.value = '';
    tableSection.style.display = 'none';
    statusBadge.textContent = '';
    parsedRows = [];
    clearError();
    htmlInput.focus();
  });

  downloadBtn.addEventListener('click', downloadMarkdown);

  // Auto-load default portfolio
